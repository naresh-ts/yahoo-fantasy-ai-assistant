[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yahoo-fantasy-ai-assistant"
version = "0.1.0"
description = "Read-only Yahoo Fantasy connector for AI-assisted league analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools]
py-modules = ["config", "server", "yahoo_client"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
